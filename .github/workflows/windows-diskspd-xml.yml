name: P2.5 DiskSpd XML integration (read-only CI)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  xml-integration:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable ref snapshot
        with:
          toolchain: 1.99.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install locked dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund
      - name: Compile strictly bounded XML parser
        run: npm run build:main
      - name: Verify official pinned DiskSpd and exercise exact-handle scratch cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE "third_party/diskspd/manifest.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.schemaVersion -ne 1 -or
              $manifest.assetUrl -ne "https://github.com/microsoft/diskspd/releases/download/v2.3/DiskSpd.ZIP" -or
              $manifest.binaryArchitecture -ne "amd64" -or
              $manifest.xmlResultVersion -ne "2.3.0" -or
              $manifest.distributionStatus -ne "bundled-in-unsigned-preview" -or
              $manifest.executableSha256 -ne "dd4e57e1e8ccaf5d6437938f8aab7f17e9a1e6d8fba8a093006b7cadf16faea2") {
            throw "DiskSpd release manifest is invalid or does not pin the approved AMD64 preview binary"
          }
          $zip = Join-Path $env:RUNNER_TEMP "diskspd-v2.3.zip"
          $folder = Join-Path $env:RUNNER_TEMP "p11-diskspd-v2.3"
          try {
            Invoke-WebRequest -Uri $manifest.assetUrl -OutFile $zip
            $sha = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sha -ne $manifest.archiveSha256) {
              throw "Official DiskSpd v2.3 release ZIP integrity mismatch"
            }
            Expand-Archive -Path $zip -DestinationPath $folder -Force
            $bins = @(Get-ChildItem -Path $folder -Filter "diskspd.exe" -Recurse -File |
              Where-Object { $_.FullName -match "[\\/]$([regex]::Escape($manifest.binaryArchitecture))[\\/]" })
            if ($bins.Count -ne 1) { throw "Expected exactly one $($manifest.binaryArchitecture) DiskSpd executable" }
            $binarySha = (Get-FileHash -LiteralPath $bins[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($binarySha -ne $manifest.executableSha256) {
              throw "Extracted DiskSpd executable hash does not match the pinned manifest"
            }
            $env:P11_DISKSPD_TEST_BINARY = $bins[0].FullName
            cargo test --locked -p partition11-benchmark-worker --lib pinned_diskspd_opens_ordinary_lease_and_exact_cleanup_under_contained_job -- --ignored
            if ($LASTEXITCODE -ne 0) { throw "Pinned DiskSpd ordinary lease and exact cleanup compatibility test failed" }
            # CI runner internally constructs its own exclusive scratch lease
            # and fixed read-only DiskSpd arguments; no renderer input is used.
            node tests/run-safe-diskspd-ci.cjs $bins[0].FullName $manifest.xmlResultVersion
            if ($LASTEXITCODE -ne 0) { throw "Owned-file DiskSpd CI test failed" }
          } finally {
            # The Node runner deletes only its verified owned file/directory.
            # No recursive cleanup or user-path deletion is permitted here.
            if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          }
