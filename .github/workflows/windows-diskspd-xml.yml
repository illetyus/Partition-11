name: P2.5 DiskSpd XML integration (read-only CI)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  xml-integration:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Install locked dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund
      - name: Compile strictly bounded XML parser
        run: npm run build:main
      - name: Verify official pinned DiskSpd and exercise read-only scratch-file
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "diskspd-v2.3.zip"
          $folder = Join-Path $env:RUNNER_TEMP "p11-diskspd-v2.3"
          try {
            Invoke-WebRequest -Uri "https://github.com/microsoft/diskspd/releases/download/v2.3/DiskSpd.ZIP" -OutFile $zip
            $sha = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sha -ne "18609981e8b04b4f645f1fd182ad0541615fe71722de36a9a933c54f747218a3") {
              throw "Official DiskSpd v2.3 release ZIP integrity mismatch"
            }
            Expand-Archive -Path $zip -DestinationPath $folder -Force
            $bins = @(Get-ChildItem -Path $folder -Filter "diskspd.exe" -Recurse -File |
              Where-Object { $_.FullName -match '[\\/]amd64[\\/]' })
            if ($bins.Count -ne 1) { throw "Expected exactly one amd64 DiskSpd executable" }
            # CI runner internally constructs its own exclusive scratch lease
            # and fixed read-only DiskSpd arguments; no renderer input is used.
            node tests/run-safe-diskspd-ci.cjs $bins[0].FullName
            if ($LASTEXITCODE -ne 0) { throw "Owned-file DiskSpd CI test failed" }
          } finally {
            # The Node runner deletes only its verified owned file/directory.
            # No recursive cleanup or user-path deletion is permitted here.
            if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          }
