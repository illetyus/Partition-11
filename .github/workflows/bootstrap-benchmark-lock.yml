name: Bootstrap XML parser lock (temporary)
on:
  push:
    branches:
      - feat/p2-5-diskspd-xml-parser
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'illetyus/Partition-11'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve lockfile without executing npm scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only the locked dependency graph
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(p2.5): pin fast-xml-parser and transitive dependencies"
            git push origin HEAD:feat/p2-5-diskspd-xml-parser
          fi
