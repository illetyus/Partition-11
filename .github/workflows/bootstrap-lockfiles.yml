name: Bootstrap dependency lockfiles (temporary)

on:
  push:
    branches: [chore/p0-lockfiles]

permissions:
  contents: write

jobs:
  generate:
    if: github.repository == 'illetyus/Partition-11'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve npm lockfile without executing dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Resolve Cargo lockfile
        run: cargo generate-lockfile
      - name: Commit generated lockfiles to this development branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: capture resolved npm and Cargo dependency locks"
            git push origin HEAD:chore/p0-lockfiles
          fi
