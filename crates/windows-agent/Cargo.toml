[package]
name = "partition11-agent"
version = "0.1.0"
description = "Non-elevated storage diagnostics and consent-gated file benchmarking; no raw-disk access or destructive operations"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "partition11-agent"
path = "src/main.rs"

[dependencies]
partition11-core = { path = "../core" }
partition11-ext-reader = { path = "../ext-reader" }
partition11-benchmark-worker = { path = "../benchmark-worker" }
